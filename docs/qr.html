<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>扫码查看会务手册</title>
  <link rel="stylesheet" href="assets/css/app.css?v=20260918e">
  <style>
    .qr-page h1 {
      font-size: clamp(26px, 6vw, 40px);
      margin: 10px 0 8px;
      letter-spacing: 0.06em;
    }
    .qr-sub {
      font-size: clamp(18px, 4.6vw, 28px);
      font-weight: 700;
      opacity: 1;
      margin: 0 0 6px;
      letter-spacing: 0.12em;
    }
    .qr-box {
      width: min(86vw, 560px);
      padding: 22px;
    }
    .print-btn {
      margin-top: 18px;
      padding: 12px 22px;
      border-radius: 999px;
      background: #fff;
      color: #0b3f93;
      font-size: 16px;
      font-weight: 700;
    }
    @media print {
      @page { size: A4 portrait; margin: 14mm; }
      .no-print { display: none !important; }
      .qr-page {
        background: #fff;
        color: #07275c;
        min-height: auto;
        padding: 0;
      }
      .qr-box {
        width: 145mm;
        padding: 8mm;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="qr-page">
    <p>黑龙江大学服务龙江高质量发展大会</p>
    <h1>扫码查看会务手册</h1>
    <p class="qr-sub">会场座位图</p>
    <div class="qr-box">
      <img src="assets/qr-print.png?v=20260918e" alt="大会二维码">
    </div>
    <div class="qr-url no-print" id="qrUrl">加载中…</div>
    <p class="no-print" style="margin-top:16px">电脑打开此页后，点下面按钮即可打印到签到处。</p>
    <button class="print-btn no-print" type="button" onclick="window.print()">打印此页</button>
  </main>
  <script>
    fetch("assets/site.json?v=20260918e")
      .then((r) => r.json())
      .then((d) => { document.getElementById("qrUrl").textContent = d.url; })
      .catch(() => { document.getElementById("qrUrl").textContent = location.origin; });
  </script>
</body>
</html>
