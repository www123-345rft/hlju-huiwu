<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>座位图</title>
  <link rel="stylesheet" href="assets/css/app.css?v=hd2">
</head>
<body class="seat-screen">
  <header class="app-bar">
    <a class="icon-btn" href="index.html" aria-label="返回">‹</a>
    <h1>座位图</h1>
    <div class="page-tag">示意</div>
  </header>
  <div class="banner">可双指缩放或用按钮放大。正式座位图替换后会更新。</div>
  <div class="zoom-bar">
    <button id="zoomOut" type="button">缩小</button>
    <button id="zoomReset" type="button">复位</button>
    <button id="zoomIn" type="button">放大</button>
  </div>
  <div class="viewer" id="viewer">
    <div class="viewer-loading" id="seatLoading">座位图加载中…</div>
    <img id="seatImg" alt="黑龙江大学体育馆示意座位图" decoding="async">
  </div>
  <script src="assets/js/cdn.js?v=hd2"></script>
  <script src="assets/js/seats.js?v=hd2"></script>
</body>
</html>
