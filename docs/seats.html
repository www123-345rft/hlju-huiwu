<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>座位图</title>
  <script>
    window.STATIC_VER = "20260918e";
    window.STATIC_BASE = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
      ? ""
      : "https://cdn.jsdmirror.com/gh/www123-345rft/hlju-huiwu@main/docs/";
    (function () {
      try {
        var u = new URL(location.href);
        if (u.searchParams.get("v") !== window.STATIC_VER) {
          u.searchParams.set("v", window.STATIC_VER);
          location.replace(u.href);
        }
      } catch (e) {}
      document.write('<link rel="stylesheet" href="' + window.STATIC_BASE + 'assets/css/app.css?v=' + window.STATIC_VER + '">');
    })();
  </script>
</head>
<body class="seat-screen">
  <header class="app-bar">
    <a class="icon-btn" href="index.html?v=20260918e" aria-label="返回">‹</a>
    <h1>座位图</h1>
    <div class="page-tag">示意</div>
  </header>
  <div class="banner">可双指缩放或用按钮放大。正式座位图替换后会更新。</div>
  <div class="zoom-bar">
    <button id="zoomOut" type="button">缩小</button>
    <button id="zoomReset" type="button">复位</button>
    <button id="zoomIn" type="button">放大</button>
  </div>
  <div class="viewer" id="viewer">
    <div class="viewer-loading" id="seatLoading">座位图加载中…</div>
    <img id="seatImg" alt="黑龙江大学体育馆示意座位图" decoding="async">
  </div>
  <script>
    (function () {
      var files = ["assets/js/e-cdn.js", "assets/js/e-seats.js"];
      var i = 0;
      function next() {
        if (i >= files.length) return;
        var el = document.createElement("script");
        el.src = window.STATIC_BASE + files[i++] + "?v=" + window.STATIC_VER;
        el.onload = next;
        document.body.appendChild(el);
      }
      next();
    })();
  </script>
</body>
</html>
